<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNAPSE | Threat Intelligence Correlation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        /* ── Custom property for gradient rotation ── */
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @property --cnt {
            syntax: '<integer>';
            initial-value: 0;
            inherits: false;
        }

        :root {
            --bg-base: #040810;
            --bg-surface: #0a0f1a;
            --bg-card: rgba(10, 15, 28, 0.82);
            --bg-elevated: #0f1628;
            --bg-input: #060810;
            --bg-hover: #141e36;
            --border: rgba(191, 219, 254, 0.12);
            --border-hover: rgba(191, 219, 254, 0.3);
            --border-active: rgba(191, 219, 254, 0.5);
            --text-primary: #f0f9ff;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #bfdbfe;
            --cyan: #bfdbfe;
            --blue: #93c5fd;
            --green: #22c55e;
            --amber: #f59e0b;
            --rose: #ef4444;
            --red: #dc2626;
            --purple: #60a5fa;
            --teal: #bae6fd;
            --radius: 16px;
            --radius-sm: 12px;
            --glow-cyan: rgba(191, 219, 254, 0.15);
            --glow-blue: rgba(147, 197, 253, 0.15);
            --glow-purple: rgba(96, 165, 250, 0.12);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg-base);
            color: var(--text-primary);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        /* ── Cyber network background photo ── */
        .bg-photo {
            position: fixed; inset: 0; z-index: 0;
            background:
                url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1920&q=80')
                center / cover no-repeat;
            filter: brightness(0.18) saturate(1.4) hue-rotate(200deg);
            pointer-events: none;
        }
        .bg-photo::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(
                180deg,
                rgba(4,6,14,0.6) 0%,
                rgba(4,6,14,0.3) 30%,
                rgba(4,6,14,0.4) 70%,
                rgba(4,6,14,0.85) 100%
            );
        }

        /* ── Ambient layers ── */
        .ambient {
            position: fixed; inset: 0; z-index: 0; pointer-events: none;
        }
        .ambient-grad {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse 1000px 700px at 10% 5%, rgba(191,219,254,0.05) 0%, transparent 55%),
                radial-gradient(ellipse 800px 600px at 90% 90%, rgba(186,230,253,0.04) 0%, transparent 55%),
                radial-gradient(ellipse 600px 500px at 50% 35%, rgba(224,242,254,0.035) 0%, transparent 55%),
                radial-gradient(ellipse 500px 400px at 70% 20%, rgba(186,230,253,0.025) 0%, transparent 50%);
        }
        .ambient svg { width: 100%; height: 100%; position: absolute; inset: 0; }
        .noise {
            position: absolute; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.02'/%3E%3C/svg%3E");
            opacity: 0.5;
        }

        /* ── Animated background elements ── */
        @keyframes dash-flow { to { stroke-dashoffset: -40; } }
        @keyframes node-pulse {
            0%, 100% { r: 2; opacity: 0.2; }
            50% { r: 3.5; opacity: 0.6; }
        }
        @keyframes radar-sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 0.15; }
            50% { opacity: 0.4; }
            100% { transform: translateY(-110vh) scale(0.3); opacity: 0; }
        }
        @keyframes hex-rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* ── Animated floating orbs ── */
        @keyframes blob-drift-1 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(80px, -60px) scale(1.1); }
            50% { transform: translate(-40px, -120px) scale(0.95); }
            75% { transform: translate(-80px, 40px) scale(1.05); }
        }
        @keyframes blob-drift-2 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(-100px, 80px) scale(1.15); }
            66% { transform: translate(60px, -80px) scale(0.9); }
        }
        @keyframes blob-drift-3 {
            0%, 100% { transform: translate(0, 0) scale(1); }
            20% { transform: translate(120px, 60px) scale(0.95); }
            40% { transform: translate(-60px, 100px) scale(1.1); }
            60% { transform: translate(-100px, -40px) scale(1.05); }
            80% { transform: translate(40px, -80px) scale(0.9); }
        }
        .ambient-blob {
            position: absolute; border-radius: 50%; filter: blur(130px); pointer-events: none;
        }
        .ambient-blob.b1 {
            width: 600px; height: 600px; top: -5%; left: 5%;
            background: #bfdbfe; opacity: 0.05;
            animation: blob-drift-1 25s ease-in-out infinite;
        }
        .ambient-blob.b2 {
            width: 500px; height: 500px; top: 35%; right: 5%;
            background: #93c5fd; opacity: 0.04;
            animation: blob-drift-2 30s ease-in-out infinite;
        }
        .ambient-blob.b3 {
            width: 450px; height: 450px; bottom: 5%; left: 35%;
            background: #60a5fa; opacity: 0.035;
            animation: blob-drift-3 35s ease-in-out infinite;
        }

        /* ── Scroll reveal ── */
        .reveal {
            opacity: 0; transform: translateY(30px);
            transition: opacity 0.8s cubic-bezier(0.16,1,0.3,1), transform 0.8s cubic-bezier(0.16,1,0.3,1);
        }
        .reveal.visible { opacity: 1; transform: translateY(0); }
        .reveal-d1 { transition-delay: 0.08s; }
        .reveal-d2 { transition-delay: 0.16s; }
        .reveal-d3 { transition-delay: 0.24s; }
        .reveal-d4 { transition-delay: 0.32s; }

        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            40% { opacity: 1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        .bg-circuit-line { stroke: rgba(224,242,254,0.05); stroke-width: 0.8; stroke-dasharray: 6 14; animation: dash-flow 5s linear infinite; }
        .bg-circuit-line.alt { stroke: rgba(191,219,254,0.04); animation-duration: 7s; animation-direction: reverse; }
        .bg-node { fill: rgba(224,242,254,0.25); animation: node-pulse 3.5s ease-in-out infinite; }
        .bg-node:nth-child(odd) { animation-delay: -1.5s; fill: rgba(191,219,254,0.2); }
        .bg-node:nth-child(3n) { animation-duration: 4.5s; fill: rgba(186,230,253,0.18); }
        .bg-radar { transform-origin: center; animation: radar-sweep 10s linear infinite; }
        .bg-particle { fill: rgba(224,242,254,0.15); animation: float-up linear infinite; }
        .bg-hex { stroke: rgba(224,242,254,0.03); stroke-width: 0.5; fill: none; transform-origin: center; animation: hex-rotate 80s linear infinite; }
        .bg-hex.r { animation-direction: reverse; stroke: rgba(191,219,254,0.025); }
        .scanline {
            position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent, rgba(191,219,254,0.08), transparent);
            animation: scanline 8s linear infinite;
            pointer-events: none;
        }

        /* ── Topnav ── */
        .topnav {
            position: sticky; top: 0; z-index: 50;
            backdrop-filter: blur(24px) saturate(1.6);
            background: rgba(4, 6, 14, 0.82);
            border-bottom: 1px solid var(--border);
            padding: 0 2.5rem; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }
        .topnav::after {
            content: ''; position: absolute; bottom: -1px; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, transparent 5%, #60a5fa, #bfdbfe, #93c5fd, #60a5fa, transparent 95%);
            opacity: 0.5;
        }
        .topnav::before {
            content: ''; position: absolute; bottom: -8px; left: 10%; right: 10%; height: 8px;
            background: linear-gradient(90deg, transparent, rgba(191,219,254,0.08), rgba(186,230,253,0.06), transparent);
            filter: blur(4px); pointer-events: none;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon {
            width: 38px; height: 38px; border-radius: 10px; position: relative;
            background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; font-size: 16px; color: #fff;
            box-shadow: 0 2px 16px rgba(191,219,254,0.35), inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .brand-icon::before {
            content: ''; position: absolute; inset: -2px; border-radius: 12px;
            background: linear-gradient(135deg, var(--cyan), var(--blue), var(--purple));
            opacity: 0.4; filter: blur(6px); z-index: -1;
        }
        .brand-name {
            font-size: 1.23rem; font-weight: 800; letter-spacing: 1.5px;
            background: linear-gradient(135deg, #f0f9ff, #bfdbfe);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .brand-sub { font-size: 0.67rem; text-transform: uppercase; letter-spacing: 2.5px; color: var(--text-muted); font-weight: 500; }
        .nav-right { display: flex; align-items: center; gap: 16px; }
        .status-pill {
            display: flex; align-items: center; gap: 8px;
            font-size: 0.77rem; color: var(--text-secondary);
            padding: 5px 14px; border-radius: 100px;
            background: rgba(191,219,254,0.06); border: 1px solid rgba(191,219,254,0.12);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%; background: #bfdbfe;
            box-shadow: 0 0 10px rgba(191,219,254,0.6);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 50% { opacity: 0.4; } }

        .export-btns { display: flex; gap: 6px; }
        .btn-exp {
            padding: 6px 14px; border-radius: 8px; font-size: 0.73rem; font-weight: 600;
            background: rgba(191,219,254,0.06); border: 1px solid rgba(191,219,254,0.12);
            color: var(--text-secondary); text-decoration: none; font-family: 'Inter', sans-serif;
            transition: all 0.25s; letter-spacing: 0.3px;
        }
        .btn-exp:hover { border-color: #bfdbfe; color: #bfdbfe; background: rgba(191,219,254,0.1); transform: translateY(-2px); box-shadow: 0 4px 12px rgba(191,219,254,0.12); }

        /* ── Layout ── */
        .content { position: relative; z-index: 2; max-width: 1560px; margin: 0 auto; padding: 1.75rem 2.5rem 3rem; }

        /* ── Animations ── */
        .anim { animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) both; }
        @keyframes rise { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
        .d1 { animation-delay: .08s; } .d2 { animation-delay: .16s; } .d3 { animation-delay: .24s; } .d4 { animation-delay: .32s; } .d5 { animation-delay: .4s; }

        /* ── Hero section ── */
        .hero {
            text-align: center; padding: 3.5rem 2rem 2.5rem; margin-bottom: 1.5rem;
            position: relative;
        }
        @keyframes logo-breathe {
            0%, 100% { filter: drop-shadow(0 0 12px rgba(191,219,254,0.3)); }
            50% { filter: drop-shadow(0 0 24px rgba(191,219,254,0.5)) drop-shadow(0 0 40px rgba(186,230,253,0.15)); }
        }
        .hero svg { animation: logo-breathe 3s ease-in-out infinite; }
        .hero-logo {
            max-width: 220px; height: auto;
            animation: logo-breathe 3s ease-in-out infinite;
        }
        .hero::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 500px; height: 300px; border-radius: 50%;
            background: radial-gradient(ellipse, rgba(191,219,254,0.04) 0%, transparent 60%);
            pointer-events: none;
        }
        .hero-title {
            font-size: 3.53rem; font-weight: 900; letter-spacing: 6px; line-height: 1;
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe, #93c5fd, #60a5fa, #bfdbfe);
            background-size: 400% 400%;
            animation: gradient-shift 6s ease infinite;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 10px; position: relative;
        }
        .hero-title::after {
            content: ''; position: absolute; inset: -30px -60px; z-index: -1;
            background: radial-gradient(ellipse, rgba(191,219,254,0.1) 0%, transparent 70%);
            border-radius: 50%;
            animation: hero-glow 4s ease-in-out infinite alternate;
        }
        @keyframes hero-glow {
            from { opacity: 0.5; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1.1); }
        }
        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }
        .hero-sub {
            font-size: 0.93rem; color: var(--text-muted); letter-spacing: 4px;
            text-transform: uppercase; font-weight: 400;
        }
        .hero-line {
            width: 120px; height: 2px; margin: 18px auto 0;
            background: linear-gradient(90deg, transparent, #60a5fa, #bfdbfe, #60a5fa, transparent);
            border-radius: 1px;
        }

        /* ── Cards with gradient border ── */
        .card {
            position: relative; border-radius: var(--radius);
            background: linear-gradient(145deg, rgba(10,15,28,0.88), rgba(7,10,20,0.92));
            backdrop-filter: blur(16px) saturate(1.4);
            overflow: hidden; transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            border: 1px solid var(--border);
        }
        .card::before {
            content: ''; position: absolute; inset: 0; border-radius: var(--radius);
            padding: 1px;
            background: linear-gradient(calc(var(--angle, 0deg) + 135deg), transparent 30%, rgba(191,219,254,0.2), rgba(186,230,253,0.15), transparent 70%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            pointer-events: none; opacity: 0; transition: opacity 0.4s;
            animation: border-rotate 6s linear infinite;
        }
        @keyframes border-rotate { to { --angle: 360deg; } }
        .card:hover::before { opacity: 1; }
        .card:hover { box-shadow: 0 12px 50px rgba(0,0,0,0.4), 0 0 40px rgba(191,219,254,0.06), inset 0 1px 0 rgba(191,219,254,0.05); transform: translateY(-4px) scale(1.005); }
        .card-head {
            padding: 16px 22px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.01);
        }
        .card-title { font-size: 0.89rem; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .card-title .dot {
            width: 8px; height: 8px; border-radius: 50%; background: var(--accent);
            box-shadow: 0 0 8px var(--glow-blue);
        }
        .card-meta { font-size: 0.73rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; letter-spacing: 0.3px; }
        .card-body { padding: 22px; }

        /* ── Section label ── */
        .sec-label {
            display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
            font-size: 0.77rem; text-transform: uppercase; letter-spacing: 2.5px;
            color: var(--text-muted); font-weight: 600;
        }
        .sec-label::before {
            content: ''; width: 4px; height: 16px; border-radius: 2px;
            background: linear-gradient(180deg, #bfdbfe, #60a5fa);
            box-shadow: 0 0 8px rgba(191,219,254,0.35);
        }
        .sec-label::after {
            content: ''; flex: 1; height: 1px;
            background: linear-gradient(90deg, var(--border), transparent 80%);
        }

        /* ── Input section (compact) ── */
        .input-card { margin-bottom: 1rem; }
        .input-header h2 {
            font-size: 1.13rem; font-weight: 700; margin-bottom: 3px;
            display: flex; align-items: center; gap: 10px;
        }
        .input-header p { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }

        .tabs {
            display: inline-flex; gap: 3px; padding: 3px; border-radius: 10px;
            background: var(--bg-base); border: 1px solid var(--border); margin-bottom: 10px;
        }
        .tabs button {
            padding: 6px 16px; border: none; background: transparent; color: var(--text-muted);
            border-radius: 8px; cursor: pointer; font-size: 0.83rem; font-weight: 500;
            font-family: 'Inter', sans-serif; transition: all 0.25s;
        }
        .tabs button.on {
            background: linear-gradient(135deg, rgba(191,219,254,0.12), rgba(186,230,253,0.08));
            color: #bfdbfe; font-weight: 600;
            box-shadow: inset 0 0 0 1px rgba(191,219,254,0.2);
        }

        textarea.inp {
            width: 100%; min-height: 100px; max-height: 160px; background: var(--bg-input);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            color: #bfdbfe; padding: 12px 14px;
            font-family: 'JetBrains Mono', monospace; font-size: 0.81rem; line-height: 1.6;
            resize: vertical; transition: all 0.3s;
        }
        textarea.inp:focus {
            outline: none; border-color: rgba(191,219,254,0.35);
            box-shadow: 0 0 0 3px rgba(191,219,254,0.08), 0 0 20px rgba(191,219,254,0.05);
        }
        textarea.inp::placeholder { color: var(--text-muted); }

        .btn-run {
            padding: 10px 34px; border: none; border-radius: 12px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer; margin-top: 12px;
            color: #0a1628; font-family: 'Inter', sans-serif; letter-spacing: 0.8px;
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe, #93c5fd);
            box-shadow: 0 4px 20px rgba(191,219,254,0.3), 0 0 50px rgba(191,219,254,0.1);
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1); position: relative; overflow: hidden;
        }
        .btn-run::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent 60%);
        }
        .btn-run::after {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: conic-gradient(transparent 0deg, rgba(255,255,255,0.08) 90deg, transparent 180deg);
            animation: btn-shimmer 3s linear infinite;
        }
        @keyframes btn-shimmer { to { transform: rotate(360deg); } }
        .btn-run:hover { transform: translateY(-3px) scale(1.02); box-shadow: 0 10px 40px rgba(191,219,254,0.4), 0 0 80px rgba(191,219,254,0.12); }
        .btn-run:active { transform: translateY(0) scale(0.98); }
        .btn-run:disabled { opacity: 0.35; cursor: not-allowed; transform: none !important; box-shadow: none !important; }

        .file-zone {
            border: 2px dashed var(--border); border-radius: var(--radius-sm);
            padding: 1.5rem 1.5rem; text-align: center; color: var(--text-muted); font-size: 0.89rem;
            cursor: pointer; transition: all 0.3s; position: relative;
        }
        .file-zone:hover { border-color: var(--cyan); background: rgba(191,219,254,0.02); }
        .file-zone input { display: none; }

        .err-box {
            background: rgba(239,68,68,0.06); border: 1px solid rgba(239,68,68,0.15);
            border-radius: 10px; padding: 12px 18px; margin-top: 14px;
            font-size: 0.85rem; color: var(--rose);
        }

        /* ── Stats ── */
        .stats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 1.5rem; }
        @media (max-width: 1100px) { .stats { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 640px)  { .stats { grid-template-columns: repeat(2, 1fr); } }
        .stat {
            background: linear-gradient(145deg, rgba(10,15,28,0.85), rgba(7,10,20,0.75));
            backdrop-filter: blur(12px);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 20px 18px 16px; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
        }
        .stat:hover { transform: translateY(-5px) scale(1.02); border-color: var(--border-hover); box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .stat::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
        .stat::before {
            content: ''; position: absolute; top: 0; left: 0; width: 80px; height: 80px;
            border-radius: 50%; filter: blur(35px); opacity: 0.08; pointer-events: none;
        }
        .stat.c-cyan::after    { background: linear-gradient(90deg, var(--cyan), transparent 70%); }
        .stat.c-cyan::before   { background: var(--cyan); }
        .stat.c-purple::after  { background: linear-gradient(90deg, var(--purple), transparent 70%); }
        .stat.c-purple::before { background: var(--purple); }
        .stat.c-amber::after   { background: linear-gradient(90deg, var(--amber), transparent 70%); }
        .stat.c-amber::before  { background: var(--amber); }
        .stat.c-green::after   { background: linear-gradient(90deg, var(--green), transparent 70%); }
        .stat.c-green::before  { background: var(--green); }
        .stat.c-rose::after    { background: linear-gradient(90deg, var(--rose), transparent 70%); }
        .stat.c-rose::before   { background: var(--rose); }
        .stat.c-blue::after    { background: linear-gradient(90deg, var(--blue), transparent 70%); }
        .stat.c-blue::before   { background: var(--blue); }
        .stat:hover::before { opacity: 0.15; }
        .stat-icon {
            font-size: 1.43rem; margin-bottom: 10px; opacity: 0.6;
            filter: drop-shadow(0 0 4px currentColor);
        }
        .stat-val {
            font-size: 2.43rem; font-weight: 900; line-height: 1; letter-spacing: -0.04em;
            margin-bottom: 5px; font-variant-numeric: tabular-nums;
            text-shadow: 0 0 30px currentColor;
        }
        .stat-lbl { font-size: 0.69rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); font-weight: 600; }

        /* ── Visual breakdown row ── */
        .viz-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
        @media (max-width: 900px) { .viz-row { grid-template-columns: 1fr; } }
        .mini-chart { display: flex; flex-direction: column; align-items: center; padding: 24px 20px; }
        .mini-chart-title {
            font-size: 0.77rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 16px;
            text-transform: uppercase; letter-spacing: 1.2px;
        }
        .donut-wrap { position: relative; width: 130px; height: 130px; }
        .donut-center {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .donut-big { font-size: 1.83rem; font-weight: 900; line-height: 1; color: #ffffff; }
        .donut-sub { font-size: 0.65rem; color: rgba(255,255,255,0.7); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 3px; }
        .donut-legend { display: flex; gap: 16px; margin-top: 16px; }
        .donut-leg-item { display: flex; align-items: center; gap: 6px; font-size: 0.79rem; color: var(--text-secondary); }
        .donut-leg-dot { width: 8px; height: 8px; border-radius: 50%; }
        .bar-list { width: 100%; }
        .bar-item { margin-bottom: 12px; }
        .bar-label { display: flex; justify-content: space-between; font-size: 0.79rem; margin-bottom: 5px; }
        .bar-label span:first-child { color: var(--text-secondary); text-transform: capitalize; }
        .bar-label span:last-child { font-weight: 600; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; }
        .bar-track { height: 7px; background: var(--bg-base); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); position: relative; }
        .bar-fill::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15));
            border-radius: 4px;

        /* ── Threat Intel Panel ── */
        .intel-wrap { margin-bottom: 1.5rem; }
        .intel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 1000px) { .intel-grid { grid-template-columns: 1fr; } }

        /* IOC cards grid */
        .ioc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; padding: 20px; }
        .ioc-node {
            background: linear-gradient(145deg, rgba(10,15,28,0.7), rgba(7,10,20,0.6));
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 16px; transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
            position: relative; overflow: hidden;
        }
        .ioc-node::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
            background: linear-gradient(90deg, var(--accent), transparent 80%);
            opacity: 0.5;
        }
        .ioc-node:hover { transform: translateY(-4px) scale(1.02); border-color: var(--border-hover);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 20px rgba(191,219,254,0.06); }
        .ioc-node.high-risk::before { background: linear-gradient(90deg, var(--rose), transparent 80%); opacity: 0.8; }
        .ioc-node-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .ioc-type-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 6px; font-size: 0.67rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .ioc-type-badge.ip { background: rgba(191,219,254,0.1); color: #bfdbfe; border: 1px solid rgba(191,219,254,0.15); }
        .ioc-type-badge.domain { background: rgba(224,242,254,0.1); color: #e0f2fe; border: 1px solid rgba(224,242,254,0.15); }
        .ioc-type-badge.hash { background: rgba(96,165,250,0.1); color: #60a5fa; border: 1px solid rgba(96,165,250,0.15); }
        .ioc-rep-dot {
            width: 10px; height: 10px; border-radius: 50%;
            box-shadow: 0 0 8px currentColor;
        }
        .ioc-val {
            font-family: 'JetBrains Mono', monospace; font-size: 0.77rem;
            color: var(--text-primary); margin-bottom: 10px; word-break: break-all;
            line-height: 1.5;
        }
        .ioc-meta { display: flex; gap: 14px; font-size: 0.69rem; color: var(--text-muted); }
        .ioc-meta strong { color: var(--text-secondary); font-weight: 600; }

        /* Hub spotlight */
        .hub-spot { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; padding: 20px; }
        .hub-node {
            background: linear-gradient(145deg, rgba(10,15,28,0.7), rgba(7,10,20,0.6));
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 20px; text-align: center; position: relative;
            transition: all 0.35s cubic-bezier(0.16,1,0.3,1);
        }
        .hub-node:hover { transform: translateY(-4px); border-color: var(--border-hover);
            box-shadow: 0 8px 30px rgba(0,0,0,0.3), 0 0 20px rgba(191,219,254,0.06); }
        .hub-rank-badge {
            position: absolute; top: 10px; left: 10px;
            width: 28px; height: 28px; border-radius: 8px;
            background: linear-gradient(135deg, rgba(191,219,254,0.12), rgba(96,165,250,0.08));
            border: 1px solid rgba(191,219,254,0.2);
            display: flex; align-items: center; justify-content: center;
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700; color: #bfdbfe;
        }
        .hub-name {
            font-family: 'JetBrains Mono', monospace; font-size: 0.79rem;
            color: var(--text-primary); margin-top: 12px; word-break: break-all;
        }
        .hub-detail { font-size: 0.69rem; color: var(--text-muted); margin-top: 6px; }

        /* Correlation pairs */
        .corr-list { padding: 14px 20px; }
        .corr-pair {
            display: flex; align-items: center; gap: 12px; padding: 12px 14px;
            border-radius: 10px; margin-bottom: 6px;
            background: rgba(7,10,20,0.4); border: 1px solid transparent;
            transition: all 0.3s; font-size: 0.79rem;
        }
        .corr-pair:hover { background: rgba(191,219,254,0.03); border-color: var(--border); transform: translateX(4px); }
        .corr-src, .corr-tgt {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            color: var(--text-primary); min-width: 0; flex: 1;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .corr-arrow {
            display: flex; align-items: center; gap: 4px; flex-shrink: 0; color: var(--text-muted);
        }
        .corr-line {
            width: 40px; height: 2px; border-radius: 1px;
            background: linear-gradient(90deg, var(--accent), var(--purple));
            position: relative;
        }
        .corr-line::after {
            content: ''; position: absolute; inset: 0; border-radius: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3));
        }
        .corr-type {
            padding: 3px 8px; border-radius: 5px; font-size: 0.65rem; font-weight: 600;
            background: rgba(191,219,254,0.06); color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace; text-transform: uppercase; letter-spacing: 0.5px;
            flex-shrink: 0;
        }
        .corr-weight {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem;
            font-weight: 700; color: var(--accent); flex-shrink: 0; min-width: 36px; text-align: right;
        }

        /* Heatmap */
        .heatmap-wrap { padding: 20px; overflow-x: auto; }
        .heatmap-wrap svg text { font-family: 'JetBrains Mono', monospace; }

        /* Timeline */
        .timeline-wrap { padding: 20px; position: relative; }
        .tl-track {
            position: relative; height: 80px; margin: 30px 0 10px;
            border-bottom: 1px solid var(--border);
        }
        .tl-dot {
            position: absolute; bottom: -5px; width: 10px; height: 10px;
            border-radius: 50%; transform: translateX(-50%);
            box-shadow: 0 0 8px currentColor;
            transition: all 0.3s; cursor: default;
        }
        .tl-dot:hover { transform: translateX(-50%) scale(1.6); }
        .tl-stem {
            position: absolute; bottom: 5px; width: 1px; left: 50%;
            background: currentColor; opacity: 0.3;
        }
        .tl-label {
            position: absolute; bottom: -24px; transform: translateX(-50%);
            font-size: 0.61rem; color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace; white-space: nowrap;
        }
        .tl-legend { display: flex; gap: 16px; justify-content: center; margin-top: 30px; font-size: 0.73rem; }
        .tl-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-secondary); }
        .tl-legend-dot { width: 8px; height: 8px; border-radius: 50%; }

        /* ── Grid ── */
        .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        @media (max-width: 1000px) { .g2 { grid-template-columns: 1fr; } }

        /* ── Campaign ── */
        .camp {
            background: linear-gradient(135deg, var(--bg-base), var(--bg-surface));
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            padding: 20px; margin-bottom: 12px; position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1); padding-left: 24px;
        }
        .camp::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 0 3px 3px 0; }
        .camp::after {
            content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 60px;
            pointer-events: none; opacity: 0; transition: opacity 0.3s;
        }
        .camp.CRITICAL::before { background: linear-gradient(180deg, var(--red), var(--rose)); }
        .camp.CRITICAL::after { background: linear-gradient(90deg, rgba(239,68,68,0.06), transparent); }
        .camp.HIGH::before { background: linear-gradient(180deg, var(--amber), #c98a1a); }
        .camp.HIGH::after { background: linear-gradient(90deg, rgba(245,158,11,0.05), transparent); }
        .camp.MEDIUM::before { background: linear-gradient(180deg, #bfdbfe, #93c5fd); }
        .camp.MEDIUM::after { background: linear-gradient(90deg, rgba(191,219,254,0.05), transparent); }
        .camp.LOW::before { background: linear-gradient(180deg, #22c55e, #16a34a); }
        .camp.LOW::after { background: linear-gradient(90deg, rgba(34,197,94,0.04), transparent); }
        .camp:hover { border-color: var(--border-hover); transform: translateX(4px); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        .camp:hover::after { opacity: 1; }
        .camp-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
        .camp-id { font-family: 'JetBrains Mono', monospace; font-size: 0.71rem; color: var(--text-muted); margin-bottom: 3px; letter-spacing: 0.5px; }
        .camp-name { font-size: 0.97rem; font-weight: 700; }
        .risk-pill {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 100px;
            font-size: 0.65rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; flex-shrink: 0;
        }
        .risk-pill.CRITICAL { background: rgba(239,68,68,0.1); color: var(--red); border: 1px solid rgba(239,68,68,0.18); box-shadow: 0 0 12px rgba(239,68,68,0.08); }
        .risk-pill.HIGH     { background: rgba(245,158,11,0.08); color: var(--amber); border: 1px solid rgba(245,158,11,0.15); }
        .risk-pill.MEDIUM   { background: rgba(191,219,254,0.08); color: #bfdbfe; border: 1px solid rgba(191,219,254,0.15); }
        .risk-pill.LOW      { background: rgba(34,197,94,0.08); color: var(--green); border: 1px solid rgba(34,197,94,0.15); }
        .risk-pill::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; box-shadow: 0 0 6px currentColor; }
        .camp-row { display: flex; gap: 22px; font-size: 0.79rem; color: var(--text-muted); margin-bottom: 8px; }
        .camp-row strong { color: var(--text-secondary); font-weight: 600; }
        .camp-infra { font-size: 0.75rem; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; margin-bottom: 6px; }
        .mitre-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
        .mt {
            padding: 4px 10px; border-radius: 6px; font-size: 0.67rem;
            font-family: 'JetBrains Mono', monospace; font-weight: 500;
            background: linear-gradient(135deg, rgba(191,219,254,0.08), rgba(186,230,253,0.08));
            color: #bfdbfe; border: 1px solid rgba(191,219,254,0.15);
            transition: all 0.25s;
        }
        .mt:hover { background: rgba(191,219,254,0.15); border-color: rgba(191,219,254,0.3); transform: translateY(-1px); }
        .conf-track { height: 4px; background: var(--bg-base); border-radius: 3px; overflow: hidden; margin-top: 12px; }
        .conf-bar { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); position: relative; }
        .conf-bar::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2)); border-radius: 3px; }

        /* ── Confidence gauge ── */
        .gauge-row {
            display: flex; gap: 14px; align-items: center; margin-top: 12px;
            padding: 12px 14px; background: rgba(5,8,16,0.5);
            border-radius: 10px; border: 1px solid rgba(255,255,255,0.02);
        }
        .gauge-mini { width: 48px; height: 48px; flex-shrink: 0; }
        .gauge-details { flex: 1; }
        .gauge-det-row { display: flex; justify-content: space-between; font-size: 0.73rem; margin-bottom: 4px; }
        .gauge-det-row span:first-child { color: var(--text-muted); }
        .gauge-det-row span:last-child { color: var(--text-secondary); font-weight: 600; font-family: 'JetBrains Mono', monospace; }

        /* ── Terminal ── */
        .term { background: linear-gradient(180deg, #060a14, #040810); border-radius: var(--radius-sm); border: 1px solid var(--border); overflow: hidden; position: relative; }
        .term::after {
            content: ''; position: absolute; inset: 0; pointer-events: none;
            background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(255,255,255,0.003) 2px, rgba(255,255,255,0.003) 4px);
        }
        .term-bar {
            display: flex; align-items: center; gap: 7px; padding: 10px 16px;
            background: rgba(255,255,255,0.015); border-bottom: 1px solid var(--border);

        .term-dot { width: 10px; height: 10px; border-radius: 50%; }

        .term-body {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; line-height: 1.8;
            white-space: pre-wrap; color: var(--text-secondary); padding: 20px;
            max-height: 620px; overflow-y: auto;
        }
        .term-body::-webkit-scrollbar { width: 4px; }
        .term-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        /* ── Hub table ── */
        .htbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 0.83rem; }
        .htbl thead th {
            text-align: left; padding: 12px 16px; font-size: 0.71rem; text-transform: uppercase;
            letter-spacing: 1.4px; color: var(--text-muted); font-weight: 600;
            border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.01);
        }
        .htbl tbody tr { transition: all 0.3s; }
        .htbl tbody tr:hover { background: rgba(191,219,254,0.04); transform: translateX(3px); }
        .htbl tbody td { padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.015); }
        .h-rank {
            font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; font-weight: 700;
            display: inline-flex; align-items: center; justify-content: center;
            width: 26px; height: 26px; border-radius: 7px;
            background: rgba(191,219,254,0.08); color: #bfdbfe;
        }
        .h-node { font-family: 'JetBrains Mono', monospace; font-size: 0.79rem; color: #bfdbfe; }
        .cbar-t { flex: 1; height: 6px; background: var(--bg-base); border-radius: 3px; overflow: hidden; }
        .cbar-f { height: 100%; background: linear-gradient(90deg, #e0f2fe, #bfdbfe, #60a5fa); border-radius: 3px; transition: width 0.6s ease; }
        .cbar-v { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: var(--text-secondary); min-width: 50px; text-align: right; font-weight: 600; }

        /* ── Loader ── */
        .loading { display: flex; flex-direction: column; align-items: center; padding: 4rem; gap: 20px; }
        .loading::before {
            content: ''; position: absolute; width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(ellipse, rgba(191,219,254,0.06) 0%, transparent 70%);
            animation: hero-glow 2s ease-in-out infinite alternate; pointer-events: none;
        }
        .ld-orb {
            position: relative; width: 60px; height: 60px;
        }
        .ld-orb .r1, .ld-orb .r2, .ld-orb .r3 {
            position: absolute; inset: 0; border-radius: 50%;
            border: 2px solid transparent;
        }
        .ld-orb .r1 { border-top-color: #bfdbfe; animation: spin 1s linear infinite; }
        .ld-orb .r2 { inset: 6px; border-right-color: #93c5fd; animation: spin 1.5s linear infinite reverse; }
        .ld-orb .r3 { inset: 12px; border-bottom-color: #60a5fa; animation: spin 2s linear infinite; }
        .ld-core {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 8px; height: 8px; border-radius: 50%; background: #bfdbfe;
            box-shadow: 0 0 14px rgba(191,219,254,0.4);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .ld-text { font-size: 0.89rem; color: var(--text-secondary); font-weight: 500; }
        .ld-sub {
            font-size: 0.73rem; font-family: 'JetBrains Mono', monospace;
            color: var(--text-muted); letter-spacing: 1px;
        }
        .ld-steps {
            display: flex; gap: 8px; margin-top: 4px;
        }
        .ld-step {
            padding: 4px 10px; border-radius: 6px; font-size: 0.67rem;
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-card); border: 1px solid var(--border);
            color: var(--text-muted); animation: step-glow 3s ease-in-out infinite;
        }
        .ld-step:nth-child(1) { animation-delay: 0s; }
        .ld-step:nth-child(2) { animation-delay: 0.6s; }
        .ld-step:nth-child(3) { animation-delay: 1.2s; }
        .ld-step:nth-child(4) { animation-delay: 1.8s; }
        .ld-step:nth-child(5) { animation-delay: 2.4s; }
        @keyframes step-glow {
            0%, 100% { color: var(--text-muted); border-color: var(--border); }
            20% { color: #bfdbfe; border-color: rgba(191,219,254,0.35); background: rgba(191,219,254,0.06); }
            40% { color: var(--text-muted); border-color: var(--border); }
        }

        /* ── Footer ── */
        .footer {
            text-align: center; padding: 3rem 0 1.5rem;
            font-size: 0.71rem; color: var(--text-muted); letter-spacing: 1.5px;
        }
        .footer-line {
            width: 80px; height: 1px; margin: 0 auto 14px;
            background: linear-gradient(90deg, transparent, #60a5fa, #bfdbfe, #60a5fa, transparent);
            opacity: 0.3;
        }
        .footer-brand {
            font-weight: 700; letter-spacing: 3px;
            background: linear-gradient(135deg, #e0f2fe, #bfdbfe, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
    </style>
</head>

/* ── Scroll reveal hook ── */
function useReveal(threshold = 0.15) {
    const ref = useRef(null);
    useEffect(() => {
        const el = ref.current;
        if (!el) return;
        const obs = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { el.classList.add('visible'); obs.unobserve(el); }
        }, { threshold });
        obs.observe(el);
        return () => obs.disconnect();
    }, []);
    return ref;
}

/* ── Live clock hook ── */
function useClock() {
    const [time, setTime] = useState(new Date());
    useEffect(() => {
        const iv = setInterval(() => setTime(new Date()), 1000);

    }, []);
    return time.toLocaleString('en-US', { hour12: false, month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' });
}

/* ── Animated counter hook ── */
function useCounter(target, duration = 800) {
    const [val, setVal] = useState(0);
    useEffect(() => {
        const t0 = performance.now();
        const num = typeof target === 'number' ? target : parseFloat(target) || 0;
        const isFloat = !Number.isInteger(num);
        const step = (now) => {
            const p = Math.min((now - t0) / duration, 1);
            const ease = 1 - Math.pow(1 - p, 3);
            setVal(isFloat ? (num * ease).toFixed(3) : Math.round(num * ease));
            if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
    }, [target, duration]);
    return val;
}

/* ── SVG donut chart ── */
function Donut({ data, size = 130 }) {
    const total = data.reduce((s, d) => s + d.value, 0);
    if (!total) return null;
    const r = size / 2, stroke = r * 0.38;
    const mid = r, cr = r - stroke / 2;
    const uid = useMemo(() => Math.random().toString(36).slice(2, 8), []);
    let cumAngle = -Math.PI / 2;
    const gap = 0.04;

    const lighten = (c) => {
        const m = { '#bfdbfe':'#e8f4ff', '#e0f2fe':'#f0f9ff', '#60a5fa':'#93c5fd',
                     'var(--red)':'#f87171', 'var(--amber)':'#fbbf24',
                     'var(--blue)':'#bfdbfe', 'var(--green)':'#4ade80',
                     '#93c5fd':'#dbeafe' };
        return m[c] || '#ffffff';
    };

    const arcs = data.map((d, i) => {
        const angle = Math.max(0, (d.value / total) * Math.PI * 2 - gap);
        const start = cumAngle + gap / 2;
        cumAngle += (d.value / total) * Math.PI * 2;
        const end = start + angle;
        const x1 = mid + cr * Math.cos(start);
        const y1 = mid + cr * Math.sin(start);
        const x2 = mid + cr * Math.cos(end);
        const y2 = mid + cr * Math.sin(end);
        const large = angle > Math.PI ? 1 : 0;
        return { ...d, path: `M ${x1} ${y1} A ${cr} ${cr} 0 ${large} 1 ${x2} ${y2}`, x1, y1, x2, y2, idx: i };
    });
    return (
        <svg width={size} height={size}>
            <defs>
                {arcs.map((a, i) => (
                    <linearGradient key={i} id={`dg-${uid}-${i}`} x1={a.x1} y1={a.y1} x2={a.x2} y2={a.y2} gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stopColor={lighten(a.color)} />
                        <stop offset="100%" stopColor={a.color} />
                    </linearGradient>
                ))}
            </defs>
            <circle cx={mid} cy={mid} r={cr} fill="none" stroke="rgba(191,219,254,0.06)" strokeWidth={stroke} />
            {arcs.map((a, i) => (
                <path key={i} d={a.path} fill="none" stroke={`url(#dg-${uid}-${i})`} strokeWidth={stroke}
                    strokeLinecap="round" style={{ transition: 'all 0.5s ease' }} />
            ))}
        </svg>
    );
}

                        const sId = e.source.id || e.source, tId = e.target.id || e.target;
                        const sNode = nodeMap[sId], tNode = nodeMap[tId];
                        return (
                            <div key={i} className="corr-pair">
                                <span className="corr-src" title={sNode?.label}>{sNode?.label || sId}</span>
                                <div className="corr-arrow">
                                    <div className="corr-line" style={{opacity: 0.4 + e.weight * 0.6}} />
                                </div>
                                <span className="corr-tgt" title={tNode?.label}>{tNode?.label || tId}</span>
                                <span className="corr-type">{relLabel[e.relationship_type] || e.relationship_type}</span>
                                <span className="corr-weight">{(e.weight * 100).toFixed(1)}%</span>
                            </div>
                        );
                    })}
                </div>
            </div>

            {/* Hub Spotlight */}
            <div className="card">
                <div className="card-head">
                    <div className="card-title"><div className="dot" style={{background:'var(--purple)', boxShadow:'0 0 8px rgba(96,165,250,0.3)'}} /> Hub Spotlight</div>
                    <div className="card-meta">degree centrality</div>
                </div>
                <div className="hub-spot">
                    {(metrics?.top_central_nodes || []).map((n, i) => {
                        const nd = nodeMap[n.node];
                        const conns = connMap[n.node] || 0;
                        return (
                            <div key={i} className="hub-node">
                                <div className="hub-rank-badge">#{i + 1}</div>
                                <div style={{marginTop:8}}>
                                    <MiniGauge value={n.centrality * 100} size={56} />
                                </div>
                                <div className="hub-name">{nd?.type === 'hash' ? n.node.substring(0, 16) + '...' : n.node}</div>
                                <div className="hub-detail">
                                    {conns} connections &middot; {nd?.type?.toUpperCase() || '?'}
                                </div>
                                <div style={{marginTop:6, display:'inline-flex', alignItems:'center', gap:4}}>
                                    <div style={{width:6, height:6, borderRadius:'50%', background: nd ? typeCol[nd.type] : '#bfdbfe'}} />
                                    <span style={{fontSize:'0.65rem', color:'var(--text-muted)'}}>Cluster {nd?.group != null ? nd.group + 1 : '?'}</span>
                                </div>
                            </div>
                        );
                    })}
                </div>
            </div>
        </div>

        {/* Activity Timeline */}
        {nodesWithTime.length > 1 && (
            <div className="card" style={{marginTop:12}}>
                <div className="card-head">
                    <div className="card-title"><div className="dot" style={{background:'var(--green)', boxShadow:'0 0 8px rgba(34,197,94,0.3)'}} /> Activity Timeline</div>
                    <div className="card-meta">{new Date(minTs).toLocaleDateString()} &mdash; {new Date(maxTs).toLocaleDateString()}</div>
                </div>
                <div className="timeline-wrap">
                    <div className="tl-track">
                        {nodesWithTime.map((n, i) => {
                            const pct = ((n.ts - minTs) / tsRange) * 100;
                            const stemH = 20 + (i % 3) * 18;
                            return (
                                <div key={n.id} style={{position:'absolute', left:`${Math.max(2, Math.min(98, pct))}%`, bottom:0}}>
                                    <div className="tl-stem" style={{height: stemH, color: typeCol[n.type]}} />
                                    <div className="tl-dot" style={{background: typeCol[n.type], color: typeCol[n.type]}}
                                         title={`${n.label} (${n.type})`} />
                                    <div className="tl-label" style={{bottom: -(38 + (i % 2) * 14)}}>
                                        {n.type === 'hash' ? n.label.substring(0, 8) + '..' : n.label}
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                    <div className="tl-legend">
                        <div className="tl-legend-item"><div className="tl-legend-dot" style={{background:'#bfdbfe'}} /> IP</div>
                        <div className="tl-legend-item"><div className="tl-legend-dot" style={{background:'#e0f2fe'}} /> Domain</div>
                        <div className="tl-legend-item"><div className="tl-legend-dot" style={{background:'#60a5fa'}} /> Hash</div>
                    </div>
                </div>
            </div>
        )}
    </div>
    );
}

/* ── Reveal wrapper ── */
function Reveal({ children, className = '', delay = 0 }) {
    const ref = useReveal();
    const delayClass = delay > 0 ? ` reveal-d${delay}` : '';
    return <div ref={ref} className={`reveal${delayClass} ${className}`}>{children}</div>;
}

/* ── App ── */
function App() {
    const [tab, setTab] = useState('json');
    const [jsonInput, setJsonInput] = useState(SAMPLE_JSON);
    const [textInput, setTextInput] = useState(SAMPLE_TEXT);
    const [loading, setLoading] = useState(false);
    const [result, setResult] = useState(null);
    const [error, setError] = useState(null);
    const fileRef = useRef(null);
    const clock = useClock();

    const analyze = async () => {
        setLoading(true); setError(null);
        try {
            let resp;
            if (tab === 'json') {
                resp = await fetch(`${API}/api/v1/analyze`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: jsonInput });
            } else if (tab === 'text') {
                resp = await fetch(`${API}/api/v1/analyze/text`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ text: textInput }) });
            } else {
                if (!fileRef.current?.files.length) { setError('No file selected.'); setLoading(false); return; }
                const fd = new FormData(); fd.append('file', fileRef.current.files[0]);
                resp = await fetch(`${API}/api/v1/analyze/upload`, { method: 'POST', body: fd });
            }
            if (!resp.ok) { const e = await resp.json(); throw new Error(e.detail || 'Analysis failed'); }
            setResult(await resp.json());
        } catch (e) { setError(e.message); }
        finally { setLoading(false); }
    };

    const confColor = s => s >= 85 ? 'var(--red)' : s >= 65 ? 'var(--amber)' : s >= 40 ? 'var(--blue)' : 'var(--green)';

    /* Visual data derivation */
    let iocBreakdown = [], relBreakdown = [], riskBreakdown = [];
    if (result) {
        const viz = result.graph_visualization;
        const ips = viz.nodes.filter(n => n.type === 'ip').length;
        const doms = viz.nodes.filter(n => n.type === 'domain').length;
        const hashes = viz.nodes.filter(n => n.type === 'hash').length;
        iocBreakdown = [
            { label: 'IPs', value: ips, color: '#bfdbfe' },
            { label: 'Domains', value: doms, color: '#e0f2fe' },
            { label: 'Hashes', value: hashes, color: '#60a5fa' },
        ];

        const relTypes = {};
        result.ioc_relationships.forEach(r => { relTypes[r.relationship_type] = (relTypes[r.relationship_type] || 0) + 1; });
        const relColors = { time_proximity: 'var(--blue)', shared_asn: 'var(--cyan)', shared_hosting: 'var(--teal)', shared_ssl_issuer: 'var(--purple)', shared_malware_family: 'var(--rose)', shared_c2_domain: 'var(--amber)', shared_ip: 'var(--blue)' };
        const totalRels = result.ioc_relationships.length || 1;
        relBreakdown = Object.entries(relTypes).sort((a, b) => b[1] - a[1]).map(([k, v]) => ({
            label: k.replace('shared_', '').replace('_', ' '),
            value: v, pct: Math.round(v / totalRels * 100),
            color: relColors[k] || 'var(--accent)',
        }));

        const rc = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0 };
        result.campaigns.forEach(c => { rc[c.risk_level]++; });
        riskBreakdown = [
            { label: 'Critical', value: rc.CRITICAL, color: 'var(--red)' },
            { label: 'High', value: rc.HIGH, color: 'var(--amber)' },
            { label: 'Medium', value: rc.MEDIUM, color: 'var(--blue)' },
            { label: 'Low', value: rc.LOW, color: 'var(--green)' },
        ].filter(r => r.value > 0);
    }

    const now = new Date().toLocaleString('en-US', { hour12: false, month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    return (
    <div>
        <nav className="topnav">
            <div className="brand"></div>
            <div className="nav-right">
                {result && (
                    <div className="export-btns">
                        <a className="btn-exp" href={`${API}/api/v1/export/json`} target="_blank">JSON</a>
                        <a className="btn-exp" href={`${API}/api/v1/export/csv/campaigns`} target="_blank">Campaigns</a>
                        <a className="btn-exp" href={`${API}/api/v1/export/csv/relationships`} target="_blank">Relations</a>
                        <a className="btn-exp" href={`${API}/api/v1/export/csv/iocs`} target="_blank">IOCs</a>
                    </div>
                )}
                <div className="status-pill" style={{fontFamily:"'JetBrains Mono', monospace", letterSpacing:'0.5px'}}>{clock}</div>
                <div className="status-pill"><div className="status-dot" /> Online</div>
            </div>
        </nav>

        <div className="content">
            {/* Hero with Logo */}
            <div className="hero anim">
                <div style={{marginBottom: '16px'}}>
                    <img src="/static/logo.png" alt="SYNAPSE" className="hero-logo"
                         onError={(e) => { e.target.style.display='none'; e.target.nextSibling.style.display='block'; }}
                    />
                    <div style={{display:'none'}}><BrainLogo size={180} /></div>
                </div>
                <div className="hero-title">SYNAPSE</div>
                <div className="hero-sub">AI-Powered Threat Intelligence Correlation Engine</div>
                <div className="hero-line" />
            </div>

            {/* Input */}
            <div className="card input-card anim d1">
                <div className="card-head">
                    <div className="card-title"><div className="dot" /> IOC Ingestion</div>
                    <div className="card-meta">{now}</div>
                </div>
                <div className="card-body" style={{padding:'16px 20px'}}>
                    <div className="input-header">
                        <h2>Submit Indicators</h2>
                        <p>Paste IOCs, upload a JSON file, or enter indicators line-by-line.</p>
                    </div>
                    <div className="tabs">
                        <button className={tab === 'json' ? 'on' : ''} onClick={() => setTab('json')}>JSON</button>
                        <button className={tab === 'text' ? 'on' : ''} onClick={() => setTab('text')}>Text</button>
                        <button className={tab === 'file' ? 'on' : ''} onClick={() => setTab('file')}>Upload</button>
                    </div>
                    {tab === 'json' && <textarea className="inp" value={jsonInput} onChange={e => setJsonInput(e.target.value)} placeholder="Paste IOC JSON..." spellCheck="false" />}
                    {tab === 'text' && <textarea className="inp" value={textInput} onChange={e => setTextInput(e.target.value)} placeholder="One IOC per line..." spellCheck="false" />}
                    {tab === 'file' && (
                        <div className="file-zone" onClick={() => fileRef.current?.click()}>
                            <input type="file" ref={fileRef} accept=".json" />
                            <div style={{marginBottom:8, fontSize:'1.43rem', opacity:0.25}}>+</div>
                            Drop JSON file or click to browse
                        </div>
                    )}
                    <button className="btn-run" onClick={analyze} disabled={loading}>
                        {loading ? 'Processing...' : 'Analyze Indicators'}
                    </button>
                    {error && <div className="err-box">{error}</div>}
                </div>
            </div>

            {loading && (
                <div className="loading anim">
                    <div className="ld-orb">
                        <div className="r1" /><div className="r2" /><div className="r3" />
                        <div className="ld-core" />
                    </div>
                    <div className="ld-text">Running Correlation Pipeline</div>
                    <div className="ld-steps">
                        <span className="ld-step">ENRICH</span>
                        <span className="ld-step">GRAPH</span>
                        <span className="ld-step">CLUSTER</span>
                        <span className="ld-step">SCORE</span>
                        <span className="ld-step">REPORT</span>
                    </div>
                </div>
            )}

            {result && !loading && (<>
                {/* Stats */}
                <Reveal><div className="sec-label">Analysis Overview</div></Reveal>
                <Reveal delay={1}><div className="stats">
                    <StatCard icon="&#9678;" value={result.graph_metrics.total_nodes} label="IOCs Analyzed" color="var(--cyan)" cssClass="c-cyan" />
                    <StatCard icon="&#9670;" value={result.campaigns.length} label="Campaigns" color="var(--purple)" cssClass="c-purple" />
                    <StatCard icon="&#8644;" value={result.graph_metrics.total_edges} label="Relations" color="var(--amber)" cssClass="c-amber" />
                    <StatCard icon="&#9673;" value={result.graph_metrics.connected_components} label="Components" color="var(--green)" cssClass="c-green" />
                    <StatCard icon="&#9888;" value={result.campaigns.filter(c => c.risk_level==='CRITICAL'||c.risk_level==='HIGH').length} label="High / Crit" color="var(--rose)" cssClass="c-rose" />
                    <StatCard icon="&#9632;" value={result.graph_metrics.density} label="Density" color="var(--blue)" cssClass="c-blue" />
                </div></Reveal>

                {/* Visual breakdown */}
                <Reveal><div className="sec-label">Visual Breakdown</div></Reveal>
                <Reveal delay={1}><div className="viz-row">
                    <div className="card">
                        <div className="card-body mini-chart">
                            <div className="mini-chart-title">IOC Type Distribution</div>
                            <div className="donut-wrap">
                                <Donut data={iocBreakdown} />
                                <div className="donut-center">
                                    <div className="donut-big">{result.graph_metrics.total_nodes}</div>
                                    <div className="donut-sub">Total</div>
                                </div>
                            </div>
                            <div className="donut-legend">
                                {iocBreakdown.map(d => (
                                    <div key={d.label} className="donut-leg-item">
                                        <div className="donut-leg-dot" style={{background:d.color, boxShadow:`0 0 6px ${d.color}`}} />
                                        {d.label}: <strong>{d.value}</strong>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="card">
                        <div className="card-body mini-chart">
                            <div className="mini-chart-title">Relationship Distribution</div>
                            <div className="bar-list" style={{width:'100%', marginTop:8}}>
                                {relBreakdown.slice(0, 5).map(r => (
                                    <div className="bar-item" key={r.label}>
                                        <div className="bar-label"><span>{r.label}</span><span>{r.value} ({r.pct}%)</span></div>
                                        <div className="bar-track"><div className="bar-fill" style={{width: `${r.pct}%`, background: r.color}} /></div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                    <div className="card">
                        <div className="card-body mini-chart">
                            <div className="mini-chart-title">Risk Distribution</div>
                            {riskBreakdown.length > 0 ? (
                                <>
                                    <div className="donut-wrap">
                                        <Donut data={riskBreakdown} />
                                        <div className="donut-center">
                                            <div className="donut-big">{result.campaigns.length}</div>
                                            <div className="donut-sub">Campaigns</div>
                                        </div>
                                    </div>
                                    <div className="donut-legend">
                                        {riskBreakdown.map(d => (
                                            <div key={d.label} className="donut-leg-item">
                                                <div className="donut-leg-dot" style={{background:d.color, boxShadow:`0 0 6px ${d.color}`}} />
                                                {d.label}: <strong>{d.value}</strong>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            ) : <div style={{color:'var(--text-muted)', fontSize:'0.87rem', marginTop:20}}>No campaigns detected</div>}
                        </div>
                    </div>
                </div></Reveal>

                {/* Threat Intel Panel */}
                <Reveal><div className="sec-label">Correlation Intelligence</div></Reveal>
                <Reveal delay={1}>
                    <ThreatIntelPanel data={result.graph_visualization} metrics={result.graph_metrics} relationships={result.ioc_relationships} />
                </Reveal>

                {/* Campaigns + Summary */}
                <Reveal><div className="sec-label">Intelligence</div></Reveal>
                <Reveal delay={1}><div className="g2">
                    <div className="card">
                        <div className="card-head">
                            <div className="card-title"><div className="dot" style={{background:'var(--amber)', boxShadow:'0 0 8px rgba(245,158,11,0.3)'}} /> Threat Campaigns</div>
                            <div className="card-meta">{result.campaigns.length} detected</div>
                        </div>
                        <div className="card-body">
                            {result.campaigns.map(c => (
                                <div key={c.campaign_id} className={`camp ${c.risk_level}`}>
                                    <div className="camp-top">
                                        <div>
                                            <div className="camp-id">{c.campaign_id}</div>
                                            <div className="camp-name">{c.name}</div>
                                        </div>
                                        <span className={`risk-pill ${c.risk_level}`}>{c.risk_level}</span>
                                    </div>
                                    <div className="camp-row">
                                        <span>Indicators: <strong>{c.ioc_count}</strong></span>
                                        <span>Confidence: <strong>{c.confidence_score}%</strong></span>
                                    </div>
                                    <div className="camp-infra">
                                        {c.core_infrastructure.slice(0, 4).join(' / ')}
                                        {c.core_infrastructure.length > 4 && ` +${c.core_infrastructure.length - 4}`}
                                    </div>
                                    {c.mitre_mappings?.length > 0 && (
                                        <div className="mitre-tags">
                                            {c.mitre_mappings.map((m, i) => <span key={i} className="mt">{m.technique_id}</span>)}
                                        </div>
                                    )}
                                    {c.confidence_breakdown && (
                                        <div className="gauge-row">
                                            <div className="gauge-mini"><MiniGauge value={c.confidence_score} /></div>
                                            <div className="gauge-details">
                                                <div className="gauge-det-row"><span>Attributes</span><span>{c.confidence_breakdown.shared_attributes_score}</span></div>
                                                <div className="gauge-det-row"><span>Density</span><span>{c.confidence_breakdown.graph_density_score}</span></div>
                                                <div className="gauge-det-row"><span>Centrality</span><span>{c.confidence_breakdown.central_node_score}</span></div>
                                                <div className="gauge-det-row"><span>Reputation</span><span>{c.confidence_breakdown.reputation_score}</span></div>
                                            </div>
                                        </div>
                                    )}
                                    <div className="conf-track">
                                        <div className="conf-bar" style={{width:`${c.confidence_score}%`, background:confColor(c.confidence_score)}} />
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-head">
                            <div className="card-title"><div className="dot" style={{background:'var(--green)', boxShadow:'0 0 8px rgba(34,197,94,0.3)'}} /> Intelligence Report</div>
                            <div className="card-meta">TLP:AMBER</div>
                        </div>
                        <div className="card-body" style={{padding: 0}}>
                            <div className="term">
                                <div className="term-bar">
                                    <div className="term-dot" style={{background:'var(--rose)'}} />
                                    <div className="term-dot" style={{background:'var(--amber)'}} />
                                    <div className="term-dot" style={{background:'var(--green)'}} />
                                    <span className="term-path">~/reports/synapse_correlation.txt</span>
                                </div>
                                <div className="term-body">{result.analyst_summary}</div>
                            </div>
                        </div>
                    </div>
                </div></Reveal>

                {/* Hub table */}
                <Reveal><div className="sec-label">Infrastructure Hubs</div></Reveal>
                <Reveal delay={1}><div className="card">
                    <div className="card-head">
                        <div className="card-title"><div className="dot" style={{background:'var(--purple)', boxShadow:'0 0 8px rgba(186,230,253,0.3)'}} /> Infrastructure Hub Analysis</div>
                        <div className="card-meta">degree centrality</div>
                    </div>
                    <div className="card-body" style={{padding:'6px 0'}}>
                        <table className="htbl">
                            <thead><tr><th style={{width:60}}>Rank</th><th>Node</th><th>Centrality</th></tr></thead>
                            <tbody>
                                {result.graph_metrics.top_central_nodes.map((n, i) => (
                                    <tr key={i}>
                                        <td><span className="h-rank">#{i + 1}</span></td>
                                        <td><span className="h-node">{n.node}</span></td>
                                        <td>
                                            <div style={{display:'flex', alignItems:'center', gap:12}}>
                                                <div className="cbar-t"><div className="cbar-f" style={{width:`${n.centrality*100}%`}} /></div>
                                                <span className="cbar-v">{(n.centrality * 100).toFixed(1)}%</span>
                                            </div>
                                        </td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                    </div>
                </div></Reveal>

                <Reveal><div className="footer">
                    <div className="footer-line" />
                    <span className="footer-brand">SYNAPSE</span> v1.0 &middot; Threat Intelligence Correlation Engine
                </div></Reveal>
            </>)}
        </div>
    </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
