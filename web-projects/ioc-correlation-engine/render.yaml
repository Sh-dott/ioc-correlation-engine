services:
  - type: web
    name: ioc-correlation-engine
    runtime: python
    rootDir: web-projects/ioc-correlation-engine
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
